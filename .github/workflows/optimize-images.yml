# Comprime automaticamente las imagenes de public/ y commitea el resultado.
#
# Por que existe: el hook `prebuild` ya comprime en cada build, pero lo hace en
# el contenedor efimero de Vercel — el resultado nunca vuelve al repo. Sin esto,
# cada PNG pesado que se commitea queda pesado en git para siempre.
#
# Diseno completo y decisiones en:
#   docs/superpowers/specs/2026-08-09-optimizacion-imagenes-programada-design.md
name: Optimizar imágenes

on:
  push:
    branches: [master]
    paths:
      - 'public/ofertas/**.png'
      - 'public/logo.png'
  # Boton manual en la pestana Actions, para forzar una pasada.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimizar:
    # Corta el loop: el commit que hace este workflow es un push a master, que
    # volveria a dispararlo. El script ademas es idempotente (test
    # "es idempotente"), asi que la segunda pasada no encontraria nada — pero
    # dependemos de las dos defensas, no de una sola.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22: Node 20 llego a EOL en abril 2026. Ademas `node --test` en 20
          # no expande globs: las 3 primeras corridas del workflow fallaron con
          # "Could not find 'scripts/**/*.test.mjs'". El script de test ahora
          # corre `node --test` sin argumentos (descubrimiento por convencion
          # *.test.mjs), que funciona igual en 20, 22 y 25.
          node-version: 22
          cache: npm

      - run: npm ci

      # Corre ANTES de optimizar: si el pipeline de compresion esta roto, el job
      # falla sin haber tocado ni un archivo del repo.
      - name: Tests del pipeline de imágenes
        run: npm test

      - name: Optimizar
        run: npm run optimize:images

      - name: Commitear si cambió algo
        run: |
          if git diff --quiet -- public/; then
            echo "Sin cambios: las imágenes ya estaban optimizadas."
            exit 0
          fi

          echo "Imágenes modificadas:"
          git diff --stat -- public/

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "chore: optimizar imágenes de ofertas"
          git push
